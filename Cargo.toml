[package]
name = "loker"
description = "Self-hosted AWS secrets manager compatible server"
version = "0.2.4"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Jacobtread <jacobtread@gmail.com>"]
repository = "https://github.com/jacobtread/loker"

[dependencies]
# Environment variables
dotenvy = "=0.15.7"

# HTTP server and utilities
axum = "=0.8.9"
axum-server = { version = "=0.9.2", features = ["tls-rustls"] }
http-body-util = "=0.1.5"
tower = { version = "=0.5.3" }
tower-http = { version = "=0.7.1", features = ["limit", "cors", "trace"] }

# Crypto provider
rustls = { version = "=0.23.46", features = ["aws-lc-rs"] }

# Async runtime and future utils
tokio = { version = "=1.54.1", features = ["full"] }
futures = "=0.3.34"

# Error helper
thiserror = "=2.0.21"

# Tracing
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Bytes
bytes = "=1.12.2"

# Serialization
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# UUID v4
uuid = { version = "=1.29.3", features = ["v4", "serde"] }

# Database (With SLQCipher)
tokio-rusqlite = { version = "0.10.0", features = [
  "bundled-sqlcipher-vendored-openssl",
  "serde_json",
  "chrono",
] }

# Precise date and time implementation
chrono = { version = "=0.4.45", features = ["serde"] }

# Random generation
rand = "=0.10.4"

# Validation
garde = { version = "=0.23.0", features = ["derive"] }

# Background task scheduling
tokio-simple-fixed-scheduler = "=0.1.0"

# AWS SigV4 signing and credentials types
aws-sigv4 = "=1.6.6"
aws-credential-types = "=1.3.1"

# Iterator utilities
itertools = "0.15.0"

[dev-dependencies]
aws-config = { version = "=1.13.3", features = ["behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "=1.129.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
